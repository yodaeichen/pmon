{% extends "base.html" %}
{% from "_m.html" import icon, csrf_field with context %}
{% block content %}
<div class="page-head"><div><span class="eyebrow">{{ icon("user") }} Mein Konto</span><h1>{{ user.display_name or user.username }}</h1>
  <p>Angemeldet als <b>{{ user.username }}</b> · Rolle {{ user.role|capitalize }}</p></div></div>
<form method="post" action="/konto" class="card" style="max-width:520px">{{ csrf_field() }}
  <h3>Passwort ändern</h3>
  <div class="field"><label>Aktuelles Passwort</label><input type="password" name="current" autocomplete="current-password" required></div>
  <div class="field"><label>Neues Passwort</label><input type="password" name="new" autocomplete="new-password" required minlength="10"></div>
  <div class="field"><label>Wiederholen</label><input type="password" name="repeat" autocomplete="new-password" required minlength="10"></div>
  <button class="btn btn-primary">Ändern</button>
</form>
{% endblock %}
