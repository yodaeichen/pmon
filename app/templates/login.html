{% extends "base.html" %}
{% from "_m.html" import icon, csrf_field with context %}
{% block body %}
<div class="login-wrap">
  <div class="login-card card">
    <div class="brand"><img src="/static/img/logo.svg" alt=""><span><b>pmon</b><small>MB-IT Solutions</small></span></div>
    <h2>Anmelden</h2>
    <p class="muted small">Schwachstellen-Übersicht für Endpoints, NAS und Server.</p>
    {% if error %}<div class="flash err">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      {{ csrf_field() }}<input type="hidden" name="next" value="{{ next }}">
      <div class="field"><label for="u">Benutzername</label><input id="u" type="text" name="username" autocomplete="username" required autofocus></div>
      <div class="field"><label for="p">Passwort</label><input id="p" type="password" name="password" autocomplete="current-password" required></div>
      <button class="btn btn-primary" type="submit">Anmelden</button>
    </form>
  </div>
</div>
{% endblock %}
